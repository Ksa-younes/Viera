<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Error</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            color: #202124;
            background-color: #ffffff;
            margin: 0;
            padding: 80px 40px 40px 80px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
        }

        .icon {
            width: 72px;
            height: 72px;
            margin-bottom: 24px;
        }

        h1 {
            font-size: 1.5rem;
            font-weight: 400;
            margin: 0 0 16px 0;
        }

        .url {
            font-weight: 700;
        }

        .main-reason {
            font-size: 0.875rem;
            margin: 0 0 16px 0;
        }

        ul {
            margin: 0 0 24px 0;
            padding-left: 20px;
            font-size: 0.875rem;
            color: #202124;
            line-height: 1.5;
        }

        li {
            margin-bottom: 4px;
        }

        .error-code {
            font-size: 0.75rem;
            color: #5f6368;
            margin-top: 16px;
        }

        button {
            background-color: #1a73e8;
            color: white;
            border: none;
            border-radius: 4px;
            padding: 8px 16px;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            margin-top: 24px;
        }

        button:hover {
            background-color: #1557b0;
        }
    </style>
</head>
<body>

    <svg class="icon" viewBox="0 0 24 24">
        <path fill="#5f6368" d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm1 15h-2v-2h2v2zm0-4h-2V7h2v6z"/>
    </svg>

    <h1><span class="url">viera.ma</span> took too long to respond.</h1>

    <p class="main-reason">Try:</p>
    <ul>
        <li>Checking the connection</li>
        <li>Checking the proxy and the firewall</li>
        <li>Running Windows Network Diagnostics</li>
    </ul>


    <div class="error-code">ERR_CONNECTION_TIMED_OUT</div>

</body>
</html>
